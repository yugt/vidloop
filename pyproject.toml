[project]
name = "vidloop"
version = "0.1.0"
description = "A team of AI agents that storyboards, generates, judges and fixes short films, and learns from each one"
readme = "README.md"
authors = [
    { name = "yugt", email = "yugtmath@umich.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.5.4",
    "openai>=3.33.0",
    "pillow>=13.0.0",
]

[project.scripts]
vidloop = "vidloop:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
